    <script src="https://cdn.jsdelivr.net/npm/exifr@7/dist/lite.umd.js"></script>

</head>
<body>

    <div id="preloader"><div class="loader-dot"></div><div class="loader-dot"></div><div class="loader-dot"></div></div>

    <!-- Navbar -->
    <nav id="navbar">
        <div class="nav-inner">
            <a href="#" class="brand">
                <img src="https://me.subromart.com/assets/icons/favicon.svg" alt="SD" class="brand-icon">
                <span class="brand-name">Subroto Das</span>
            </a>
            <div class="nav-right" id="navMenu">
                <a href="https://me.subromart.com" target="_blank" class="nav-link">Portfolio</a>
                <button class="nav-upload" id="openUploadBtn"><i data-lucide="plus"></i><span>Upload</span></button>
            </div>
            <button class="hamburger" id="hamburger" aria-label="Menu"><span></span><span></span></button>
        </div>
    </nav>

    <!-- Gallery -->
    <main id="gallery">
        <div class="container">
            <div class="gallery-header">
                <div class="gallery-title-row">
                    <h1 class="gallery-title">Gallery</h1>
                    <span class="photo-count"><span id="totalPhotos">0</span> photos</span>
                </div>
                <div class="ornament"><span class="ornament-diamond"></span></div>
                <div class="toolbar">
                    <div class="pills" id="pillsWrap">
                        <button class="pill active" data-filter="all">All</button>
                        <span id="categoryFilters"></span>
                    </div>
                    <div class="search-box">
                        <i data-lucide="search"></i>
                        <input type="text" id="searchInput" placeholder="Search by caption, category or date...">
                    </div>
                </div>
                <p class="search-hint">Try: "2024-01", "January", "Travel", or any date</p>
            </div>
            <div class="masonry" id="galleryGrid">
                <div class="empty-state">
                    <i data-lucide="image"></i>
                    <p>No photos yet</p>
                </div>
            </div>
            <div class="more-wrap" id="loadMoreContainer" style="display:none">
                <button class="more-btn" id="loadMoreBtn">Load More</button>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container footer-row">
            <div class="footer-brand">
                <img src="https://me.subromart.com/assets/icons/favicon.svg" alt="" class="footer-icon">
                <span>Subroto Das</span>
            </div>
            <div class="footer-links">
                <a href="https://me.subromart.com" target="_blank">Portfolio</a>
                <a href="https://systems.subromart.com" target="_blank">Systems</a>
                <a href="https://subromart.com" target="_blank">SubroMart</a>
                <a href="mailto:subroto.das@asgshop.com.bd">Email</a>
            </div>
        </div>
    </footer>

    <!-- Upload Modal -->
    <div class="modal-bg" id="uploadModal">
        <div class="modal">
            <div class="modal-top">
                <h2>Upload Photos</h2>
                <button class="modal-x" id="closeModal"><i data-lucide="x"></i></button>
            </div>
            <div class="pin-step" id="pinGate">
                <h3>Enter PIN</h3>
                <input type="password" id="pinInput" maxlength="6" placeholder="• • • • • •" class="pin-field" autocomplete="off">
                <button class="btn" id="pinSubmitBtn">Unlock</button>
                <p class="pin-err" id="pinError">Wrong PIN</p>
                <div id="tokenRow" style="display:none;margin-top:18px;text-align:left">
                    <p style="font-size:.78rem;color:var(--text-2);margin-bottom:8px">First time setup — enter your GitHub token:</p>
                    <input type="password" id="tokenInput" placeholder="ghp_... or github_pat_..." class="field" autocomplete="off">
                    <button class="btn" id="tokenSaveBtn">Save & Continue</button>
                </div>
            </div>
            <div class="upload-step" id="uploadForm" style="display:none">
                <input type="text" id="photoCategory" placeholder="Category (e.g. Travel, Nature)" class="field">
                <textarea id="photoCaption" placeholder="Caption..." class="field field-area"></textarea>
                <div class="dropzone" id="dropZone">
                    <i data-lucide="image-plus"></i>
                    <p>Drop images here or click to browse</p>
                    <input type="file" id="fileInput" multiple accept="image/*" hidden>
                </div>
                <div class="thumbs" id="previewGrid"></div>
                <button class="btn" id="uploadBtn" disabled>Upload</button>
                <div class="prog" id="uploadProgress" style="display:none">
                    <div class="prog-track"><div class="prog-bar" id="progressFill"></div></div>
                    <p class="prog-label" id="progressText"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <button class="lb-x" id="lightboxClose"><i data-lucide="x"></i></button>
        <button class="lb-arr lb-left" id="lightboxPrev"><i data-lucide="chevron-left"></i></button>
        <button class="lb-arr lb-right" id="lightboxNext"><i data-lucide="chevron-right"></i></button>
        <div class="lb-stage">
            <img src="" alt="" id="lightboxImg">
            <div class="lb-info">
                <div class="lb-cap">
                    <h3 id="lightboxCaption"></h3>
                    <p id="lightboxMeta"></p>
                </div>
                <div class="lb-exif" id="lightboxExif"></div>
            </div>
        </div>
    </div>

    <div class="toasts" id="toastContainer"></div>
    <script src="script.js"></script>
</body>
</html>
