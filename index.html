<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Subroto Das Photo Gallery — Browse Photography Collection</title>
    <meta name="description" content="Browse the official photo gallery of Subroto Das, Software Engineer at Apar's Classroom. Explore photos by date, category and camera metadata.">
    <meta name="keywords" content="Subroto Das, photo gallery, photography, subromart, software engineer">
    <meta name="author" content="Subroto Das">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <meta name="theme-color" content="#b8952e">
    <link rel="icon" type="image/png" href="https://me.subromart.com/favicon.png">
    <link rel="apple-touch-icon" href="https://me.subromart.com/favicon.png">
    <link rel="canonical" href="https://photos.subromart.com/">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://photos.subromart.com/">
    <meta property="og:title" content="Subroto Das Photo Gallery">
    <meta property="og:description" content="Browse the photo gallery of Subroto Das, Software Engineer.">
    <meta property="og:image" content="https://me.subromart.com/assets/images/about.png">
    <meta property="og:site_name" content="Subroto Das Photos">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Subroto Das Photo Gallery">
    <meta name="twitter:image" content="https://me.subromart.com/assets/images/about.png">
    <script type="application/ld+json">{"@context":"https://schema.org","@type":"ImageGallery","name":"Subroto Das Photo Gallery","url":"https://photos.subromart.com","author":{"@type":"Person","name":"Subroto Das","jobTitle":"Software Engineer","worksFor":{"@type":"Organization","name":"Apar's Classroom"},"url":"https://me.subromart.com","sameAs":["https://me.subromart.com","https://subromart.com","https://systems.subromart.com","https://github.com/subroto23"]}}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/exifr@7/dist/lite.umd.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="preloader"><div class="ld"></div><div class="ld"></div><div class="ld"></div></div>

    <nav id="navbar">
        <div class="nav-inner">
            <a href="/" class="brand" title="Subroto Das Photo Gallery">
                <img src="https://me.subromart.com/assets/icons/favicon.svg" alt="Subroto Das" width="26" height="26">
                <span>Gallery</span>
            </a>
            <div class="nav-controls">
                <div class="date-range">
                    <input type="date" id="dateFrom" title="From date">
                    <span class="date-sep">—</span>
                    <input type="date" id="dateTo" title="To date">
                    <button class="date-clear" id="dateClear" title="Clear dates"><i data-lucide="x" style="width:14px;height:14px"></i></button>
                </div>
                <button class="upload-btn" id="openUploadBtn" aria-label="Upload photos"><i data-lucide="plus"></i></button>
            </div>
        </div>
    </nav>

    <main id="gallery">
        <div class="masonry" id="galleryGrid"></div>
        <div class="more-wrap" id="loadMoreContainer" style="display:none">
            <button class="more-btn" id="loadMoreBtn">Load More</button>
        </div>
        <div class="empty" id="emptyState">
            <i data-lucide="image"></i>
            <p>No photos yet</p>
        </div>
    </main>

    <footer>
        <div class="footer-inner">
            <span class="footer-copy">&copy; Subroto Das</span>
            <div class="footer-links">
                <a href="https://me.subromart.com" target="_blank" rel="noopener">Portfolio</a>
                <a href="https://systems.subromart.com" target="_blank" rel="noopener">Systems</a>
                <a href="https://subromart.com" target="_blank" rel="noopener">SubroMart</a>
                <a href="mailto:subroto.das@asgshop.com.bd">Email</a>
            </div>
        </div>
    </footer>

    <!-- Upload Modal -->
    <div class="modal-bg" id="uploadModal">
        <div class="modal">
            <div class="modal-head">
                <h2>Upload</h2>
                <button class="modal-x" id="closeModal"><i data-lucide="x"></i></button>
            </div>
            <div id="pinGate" class="modal-body pin-body">
                <input type="password" id="pinInput" maxlength="6" placeholder="• • • • • •" class="pin-field" autocomplete="off">
                <button class="btn" id="pinSubmitBtn">Unlock</button>
                <p class="pin-err" id="pinError">Wrong PIN</p>
                <div id="tokenRow" style="display:none;margin-top:16px">
                    <p class="hint">First time — enter GitHub token:</p>
                    <input type="password" id="tokenInput" placeholder="ghp_... or github_pat_..." class="field" autocomplete="off">
                    <button class="btn" id="tokenSaveBtn">Save</button>
                </div>
            </div>
            <div id="uploadForm" class="modal-body" style="display:none">
                <input type="text" id="photoCategory" placeholder="Category (e.g. Travel)" class="field">
                <textarea id="photoCaption" placeholder="Caption..." class="field ta"></textarea>
                <div class="dropzone" id="dropZone">
                    <i data-lucide="image-plus"></i>
                    <p>Drop or click to browse</p>
                    <input type="file" id="fileInput" multiple accept="image/*" hidden>
                </div>
                <div class="thumbs" id="previewGrid"></div>
                <button class="btn" id="uploadBtn" disabled>Upload</button>
                <div class="prog" id="uploadProgress" style="display:none">
                    <div class="prog-track"><div class="prog-fill" id="progressFill"></div></div>
                    <p class="prog-text" id="progressText"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Lightbox -->
    <div class="lb" id="lightbox">
        <button class="lb-close" id="lightboxClose"><i data-lucide="x"></i></button>
        <button class="lb-nav lb-prev" id="lightboxPrev"><i data-lucide="chevron-left"></i></button>
        <button class="lb-nav lb-next" id="lightboxNext"><i data-lucide="chevron-right"></i></button>
        <div class="lb-center">
            <img id="lightboxImg" alt="">
            <div class="lb-info">
                <h3 id="lightboxCaption"></h3>
                <p id="lightboxMeta"></p>
                <div class="lb-exif" id="lightboxExif"></div>
            </div>
        </div>
    </div>

    <div class="toasts" id="toastContainer"></div>
    <script src="script.js"></script>
</body>
</html>
