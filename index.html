<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Subroto Das Photo Gallery — Browse Photography Collection</title>
    <meta name="description" content="Browse the official photo gallery of Subroto Das, Software Engineer at Apar's Classroom. Explore photos by capture date and camera metadata.">
    <meta name="author" content="Subroto Das">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <meta name="theme-color" content="#b8952e">
    <link rel="icon" type="image/png" href="https://me.subromart.com/favicon.png">
    <link rel="apple-touch-icon" href="https://me.subromart.com/favicon.png">
    <link rel="canonical" href="https://photos.subromart.com/">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://photos.subromart.com/">
    <meta property="og:title" content="Subroto Das Photo Gallery">
    <meta property="og:description" content="Browse the photo gallery of Subroto Das, Software Engineer.">
    <meta property="og:image" content="https://me.subromart.com/assets/images/about.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Subroto Das Photo Gallery">
    <meta name="twitter:image" content="https://me.subromart.com/assets/images/about.png">
    <script type="application/ld+json">{"@context":"https://schema.org","@type":"ImageGallery","name":"Subroto Das Photo Gallery","url":"https://photos.subromart.com","author":{"@type":"Person","name":"Subroto Das","jobTitle":"Software Engineer","worksFor":{"@type":"Organization","name":"Apar's Classroom"},"url":"https://me.subromart.com","sameAs":["https://me.subromart.com","https://subromart.com","https://systems.subromart.com","https://github.com/subroto23"]}}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/exifr@7/dist/lite.umd.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="preloader">
        <span class="pre-brand">Subroto Das</span>
        <div class="ld-wrap"><div class="ld"></div><div class="ld"></div><div class="ld"></div></div>
    </div>

    <nav id="navbar">
        <div class="nav-inner">
            <a href="/" class="brand">
                <img src="https://me.subromart.com/assets/icons/favicon.svg" alt="Subroto Das" width="32" height="32">
                <span class="brand-name">Subroto Das<span class="brand-dot"></span></span>
            </a>
            <div class="nav-right">
                <div class="date-picker" id="datePicker">
                    <i data-lucide="calendar" class="dp-icon"></i>
                    <input type="date" id="dateFrom" title="From">
                    <span class="dp-dash">–</span>
                    <input type="date" id="dateTo" title="To">
                    <button id="dateClear" class="dp-clear" title="Clear"><i data-lucide="x"></i></button>
                </div>
                <button class="filter-toggle" id="filterToggle" aria-label="Filter"><i data-lucide="sliders-horizontal"></i></button>
                <button id="openUploadBtn" class="btn-upload" aria-label="Upload"><i data-lucide="plus"></i></button>
            </div>
        </div>
    </nav>

    <main id="gallery">
        <div class="gallery-intro"><div class="gallery-divider"></div></div>
        <div id="timeline"></div>
        <div id="emptyState" class="empty-msg">
            <i data-lucide="camera"></i>
            <p>No photos</p>
        </div>
    </main>

    <footer>
        <div class="f-line"></div>
        <span class="f-brand">Subroto Das</span>
        <div class="f-links">
            <a href="https://me.subromart.com" target="_blank" rel="noopener">Portfolio</a>
            <a href="https://systems.subromart.com" target="_blank" rel="noopener">Systems</a>
            <a href="https://subromart.com" target="_blank" rel="noopener">SubroMart</a>
            <a href="mailto:subroto.das@asgshop.com.bd">Email</a>
        </div>
        <span class="f-copy">&copy; 2024 Subroto Das. All rights reserved.</span>
    </footer>

    <!-- Upload -->
    <div class="overlay" id="uploadModal">
        <div class="modal">
            <div class="m-head"><h2>Upload</h2><button id="closeModal" class="m-x"><i data-lucide="x"></i></button></div>
            <div id="pinGate" class="m-body m-center">
                <input type="password" id="pinInput" maxlength="6" placeholder="• • • • • •" class="pin" autocomplete="off">
                <button class="btn" id="pinSubmitBtn">Unlock</button>
                <p class="err" id="pinError">Wrong PIN</p>
                <div id="tokenRow" style="display:none;margin-top:14px;text-align:left">
                    <p class="small-hint">First time — enter GitHub token:</p>
                    <input type="password" id="tokenInput" placeholder="ghp_... or github_pat_..." class="inp" autocomplete="off">
                    <button class="btn" id="tokenSaveBtn">Save</button>
                </div>
            </div>
            <div id="uploadForm" class="m-body" style="display:none">
                <input type="text" id="photoCategory" placeholder="Category" class="inp">
                <textarea id="photoCaption" placeholder="Caption..." class="inp inp-ta"></textarea>
                <div class="drop" id="dropZone">
                    <i data-lucide="image-plus"></i>
                    <p>Drop or tap to browse</p>
                    <input type="file" id="fileInput" multiple accept="image/*" hidden>
                </div>
                <div class="thumbs" id="previewGrid"></div>
                <button class="btn" id="uploadBtn" disabled>Upload</button>
                <div class="prog" id="uploadProgress" style="display:none">
                    <div class="prog-bar"><div class="prog-fill" id="progressFill"></div></div>
                    <p class="prog-txt" id="progressText"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Lightbox -->
    <div class="lb" id="lightbox">
        <button class="lb-x" id="lightboxClose"><i data-lucide="x"></i></button>
        <button class="lb-arr lb-l" id="lightboxPrev"><i data-lucide="chevron-left"></i></button>
        <button class="lb-arr lb-r" id="lightboxNext"><i data-lucide="chevron-right"></i></button>
        <div class="lb-main">
            <img id="lightboxImg" alt="">
            <div class="lb-cap">
                <h3 id="lightboxCaption"></h3>
                <p id="lightboxMeta"></p>
                <div class="lb-exif" id="lightboxExif"></div>
            </div>
        </div>
    </div>

    <div class="toasts" id="toastContainer"></div>
    <script src="script.js"></script>
</body>
</html>
